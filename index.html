<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>假分數與帶分數 互動教室 (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6ee;--card:#fff;--ink:#2f2a26;--muted:#7a6f66;--line:#e9dfd2;
  --pink:#e2577a;--pinkL:#fde3ea;--blue:#3c95d1;--blueL:#e2f1fa;--green:#4f9a41;--greenL:#e6f4df;
  --orange:#e57e2c;--orangeL:#fdebd9;--red:#d9443a;--yellow:#ffe9a8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:19px;line-height:1.65}
button{font-family:inherit;cursor:pointer}
header{background:#fff;border-bottom:3px solid var(--line);padding:12px 16px 0;position:sticky;top:0;z-index:10}
.top{display:flex;align-items:center;gap:12px;max-width:1080px;margin:0 auto;flex-wrap:wrap}
h1{font-size:23px;margin:0;font-weight:900;letter-spacing:1px}
.top .sp{flex:1}
.sndbtn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:15px;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-width:1080px;margin:12px auto 0}
nav a{--c:#e2577a;display:flex;align-items:center;gap:9px;min-width:0;text-decoration:none;color:var(--muted);padding:8px 10px 9px;border-radius:14px 14px 0 0;background:#f3ece2;border:2px solid transparent;border-top:4px solid transparent;border-bottom:none;transition:background .15s}
nav a:nth-child(2){--c:#d4a017} nav a:nth-child(3){--c:#3c95d1} nav a:nth-child(4){--c:#4f9a41} nav a:nth-child(5){--c:#e57e2c} nav a:nth-child(6){--c:#8a63c9}
nav a:hover{background:#efe5d8}
nav a .no{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--c);font-weight:900;font-size:16px;box-shadow:inset 0 0 0 2px var(--c)}
nav a .nt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
nav a .nt b{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav a .nt small{font-size:12.5px;font-weight:500;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav a.on{background:var(--bg);color:var(--ink);border-color:var(--line);border-top-color:var(--c);position:relative;top:3px}
nav a.on .no{background:var(--c);color:#fff;box-shadow:none}
nav a.on .nt small{color:var(--c);opacity:1}
@media (max-width:640px){.top{flex-wrap:nowrap;gap:8px}.top h1{font-size:18px}.sndbtn{font-size:12px;padding:2px 8px;white-space:nowrap}}
@media (max-width:980px){nav{display:flex;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav a{flex:none;min-width:148px}}
main{max-width:1080px;margin:0 auto;padding:16px 14px 70px}

details.concept{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 18px;margin-bottom:16px}
details.concept summary{font-weight:900;cursor:pointer;color:var(--pink)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:10px 0 4px}
.cbox{border-radius:14px;padding:10px 14px;background:var(--bg)}
.cbox b{font-size:20px}
.cbox.c1{background:var(--blueL)} .cbox.c2{background:var(--pinkL)} .cbox.c3{background:var(--greenL)}

.unit{display:none}
.unit.on{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.intro h2{margin:2px 0 2px;font-size:25px;font-weight:900}
.intro p{margin:0 0 12px;color:var(--muted)}
.modebar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.mode{font-size:19px;font-weight:900;padding:10px 22px;border-radius:999px;border:3px solid var(--line);background:#fff;color:var(--muted)}
.mode.on{background:var(--ink);border-color:var(--ink);color:#fff}

.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:0 3px 0 var(--line)}
.opts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:16px;color:var(--muted);font-weight:700}
.opt{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;font-size:16px;font-weight:700;color:var(--muted)}
.opt.on{background:var(--orangeL);border-color:var(--orange);color:#9a4a0e}
.newex{border:2px dashed var(--orange);background:#fff;border-radius:999px;padding:4px 14px;font-size:16px;font-weight:700;color:var(--orange);margin-left:auto}

.figwrap{text-align:center;padding:10px 4px;min-height:40px;background:repeating-linear-gradient(0deg,#fffdf9,#fffdf9 27px,#f8f1e7 28px);border-radius:16px;border:1px solid #f1e8dc;margin:6px 0 12px;overflow:hidden}
.figwrap:empty{display:none}
svg.fig{max-width:100%;height:auto;display:inline-block;vertical-align:middle;user-select:none;-webkit-user-select:none}
.fig line,.fig .ol,.fig .labels,.fig text{pointer-events:none}
.pc.on{cursor:pointer;transition:filter .15s}
.pc.on:hover{filter:brightness(.95)}
.pc.counted{filter:brightness(.88) saturate(1.3)}
.num{font-size:15px;font-weight:900;fill:#2f2a26;text-anchor:middle;dominant-baseline:central;stroke:#fff;stroke-width:3.5px;paint-order:stroke}
.halo{fill:none;stroke:var(--orange);stroke-width:4;stroke-dasharray:9 6;opacity:0;transition:opacity .25s}
.halo.show{opacity:1}
.dash{stroke:#777;stroke-width:1.3;stroke-dasharray:4 3}
.faint{stroke:#9cc9e6;stroke-width:1;stroke-dasharray:3 4}
.ilab{font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#2f2a26}
.flab{font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:#555}
.segn{font-size:13px;font-weight:900;text-anchor:middle;dominant-baseline:central;fill:#a1500f}
.mlab{font-size:14px;font-weight:900;text-anchor:middle;fill:var(--green)}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:rgba(229,126,44,.13)}
.hit.tick:hover{fill:rgba(60,149,209,.18)}

.stepbox{display:flex;gap:12px;align-items:flex-start;background:var(--blueL);border-radius:16px;padding:12px 16px}
.stepno{flex:none;background:var(--blue);color:#fff;font-weight:900;border-radius:12px;padding:2px 10px;font-size:15px;margin-top:4px;white-space:nowrap}
.stext{flex:1;font-size:21px;line-height:1.9}
.spk{flex:none;border:none;background:#fff;border-radius:50%;width:44px;height:44px;font-size:20px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.spk.sm{width:36px;height:36px;font-size:16px}
.sumline{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px;vertical-align:middle}
.sumline .pl{margin:0 4px;font-weight:700}
.spkhint{flex:none;align-self:flex-start;margin-top:6px;background:#ffd23f;color:#5a3d00;font-weight:900;font-size:15px;line-height:1.4;border-radius:999px;padding:5px 12px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.12);cursor:pointer;user-select:none}
.qhead .spkhint{align-self:center;margin-top:0}
.spkhint.live{animation:hintbob 1s ease-in-out infinite}
@keyframes hintbob{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media (max-width:640px){.spkhint{font-size:13px;padding:4px 9px}.stepbox{flex-wrap:wrap;align-items:center}.stepbox .stext{order:3;flex-basis:100%}.stepbox .spkhint{margin-left:auto;margin-top:0;align-self:center}.stepbox .stepno{margin-top:0}.qhead .qtext{order:3;flex-basis:100%}.qhead .spkhint{margin-left:auto}}
.next.glow{animation:nextglow 1s ease-in-out infinite}
@keyframes nextglow{0%,100%{box-shadow:0 0 0 0 rgba(255,196,0,0);transform:scale(1)}50%{box-shadow:0 0 0 7px rgba(255,196,0,.5),0 0 20px 6px rgba(255,210,60,.8);transform:scale(1.08);background:#2b84c4}}
.spk.pulse{animation:spkglow 1.1s ease-in-out infinite}
@keyframes spkglow{0%,100%{box-shadow:0 0 0 0 rgba(255,196,0,0),0 2px 0 rgba(0,0,0,.08);transform:scale(1)}50%{box-shadow:0 0 0 8px rgba(255,196,0,.45),0 0 18px 6px rgba(255,210,60,.75);transform:scale(1.15);background:#fff4c2}}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:14px}
.ctrl button{font-size:18px;font-weight:900;border-radius:999px;padding:9px 20px;border:none}
.prev{background:#f1ebe3;color:var(--muted)}
.prev:disabled{opacity:.4;cursor:default}
.next{background:var(--blue);color:#fff;margin-left:auto}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots span{width:12px;height:12px;border-radius:50%;background:#e5dccf}
.dots span.done{background:#9cc9e6}
.dots span.on{background:var(--blue);transform:scale(1.25)}
.sum{display:inline-block;background:#fff;border:3px solid var(--orange);border-radius:14px;padding:4px 16px;margin:4px 0;font-size:24px;font-weight:900}
.rule{margin-top:6px;background:var(--yellow);border-radius:10px;padding:4px 12px;font-size:18px;font-weight:700;display:inline-block}
b.hd{color:var(--blue)} b.hw{color:var(--pink)} b.hn{color:var(--orange)}

/* fractions */
.mf{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;margin:0 3px}
.mf .w{font-size:1.3em;font-weight:700;line-height:1}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.12;font-weight:700;font-size:.92em}
.fr .n{border-bottom:2.5px solid currentColor;padding:0 4px;min-width:1.2em;text-align:center}
.fr .d{padding:0 4px;text-align:center}

/* practice */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{background:var(--pink);color:#fff;font-weight:900;border-radius:10px;padding:2px 12px;font-size:16px}
.qtext{font-size:21px;font-weight:700;flex:1}
.qtext .tm{color:var(--pink)} .qtext .ti{color:var(--blue)}
.score{margin-left:auto;font-size:15px;color:var(--muted);font-weight:700;background:var(--bg);border-radius:999px;padding:3px 12px}
.qtools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px;color:var(--muted);margin-bottom:6px}
.qtools:empty{display:none}
.qtools .info{color:var(--orange);font-weight:900;font-size:18px}
.qtools .cnt{font-weight:700;color:var(--ink)} .qtools .cnt b{color:var(--orange);font-size:22px}
.sm{border:2px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700;color:var(--ink)}
.sm.on{background:var(--yellow);border-color:#e8c45a}
.qans{display:flex;align-items:center;justify-content:center;gap:10px;font-size:24px;font-weight:700;margin:10px 0 6px;flex-wrap:wrap}
.qans .bigw{font-size:34px;font-weight:900}
.ab{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:2px dashed #d9c9b5;border-radius:16px;background:#fffdf9}
.ab input{width:62px;height:48px;font-size:26px;text-align:center;border:2px solid #cdbfae;border-radius:10px;font-family:inherit;font-weight:700;color:var(--ink);background:#fff}
.ab input.locked{background:#f1ece5;border-style:dashed;opacity:.4;cursor:not-allowed}

@keyframes fillglow{0%,100%{box-shadow:0 0 0 0 rgba(255,196,0,0)}50%{box-shadow:0 0 0 6px rgba(255,196,0,.55),0 0 14px 4px rgba(255,210,60,.7)}}
.ab input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(60,149,209,.25)}
.ab .iw{height:62px;width:62px;font-size:32px}
.ab input.single{width:72px;height:58px;font-size:30px}
.ab.one .okmark{right:-30px;top:-40px;width:66px;height:54px}
.ab input.nextfill,.ab input.nextfill:focus{border-color:#f0b400;border-width:3px;background:#fff8d6;animation:fillglow 1.1s ease-in-out infinite}
.ab .frin{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.ab .bar{width:74px;height:3px;background:var(--ink);border-radius:2px}
.ab .dfix{font-size:26px;font-weight:700;height:48px;display:grid;place-items:center}
.qbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.qbtns button{font-size:18px;font-weight:900;border-radius:999px;padding:9px 20px;border:none}
.check{background:var(--green);color:#fff}
.hint{background:var(--yellow);color:#7a5a00}
.show{background:#f1ebe3;color:var(--muted)}
.nextq{background:var(--blue);color:#fff}
.qwork{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:center;margin-top:6px}
.qwork .fb{margin-top:0}
.qwork .fb:empty{display:block;visibility:hidden}
@media (max-width:760px){.qwork{grid-template-columns:1fr}.qwork .fb:empty{display:none}}
.ab{position:relative}
.okmark{position:absolute;right:-62px;top:-30px;width:80px;height:66px;pointer-events:none;overflow:visible;opacity:0}
.okmark path{fill:none;stroke:#e0261b;stroke-width:11;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:140;stroke-dashoffset:140}
.qans>.okmark{position:static;display:none}
.qans.ok .okmark{opacity:1}
.qans.ok>.okmark{display:block}
.qans.ok .okmark path{animation:drawtick .45s ease-out forwards}
@keyframes drawtick{to{stroke-dashoffset:0}}
.fb{margin-top:14px;border-radius:16px;padding:0 16px;font-size:20px;line-height:1.9;min-height:0}
.fb:empty{display:none}
.fb.good{background:var(--greenL);border:2px solid #a9d59a;padding:10px 16px;animation:pop .35s}
.fb.bad{background:var(--pinkL);border:2px solid #f2b0c1;padding:10px 16px;animation:shake .35s}
.fb.info{background:#fff7d9;border:2px solid #f0d77e;padding:10px 16px}
.fb .ttl{font-weight:900;font-size:22px;margin-right:6px}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stars{font-size:22px;letter-spacing:2px}
/* ===== 學習單 ===== */
.wsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:10px}
@media (max-width:420px){.wsgrid{grid-template-columns:1fr}.wst{font-size:15px}}
.wst{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:8px 12px;font-weight:700;font-size:17px}
.wst label{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer}
.wst input[type=checkbox],.wsopts input[type=checkbox]{width:20px;height:20px;accent-color:var(--pink)}
.wst.off{opacity:.5}
.wst select{font-family:inherit;font-size:17px;border:2px solid var(--line);border-radius:8px;padding:2px 6px;background:#fff}
.wsopts{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:12px;font-size:16px;color:var(--muted);font-weight:700}
.wsopts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.wsin{font-family:inherit;font-size:17px;border:2px solid var(--line);border-radius:10px;padding:4px 10px;width:300px;max-width:70vw;color:var(--ink)}
.wsbtns{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.wsbtns button{font-size:18px;font-weight:900;border-radius:999px;padding:9px 22px;border:none}
.wsbtns button:disabled{opacity:.5;cursor:wait}
.wsmsg{font-weight:700;color:var(--orange)}
.wsprev{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:18px}
.a4wrap{position:relative;box-shadow:0 4px 18px rgba(0,0,0,.13);background:#fff;flex:none}
.a4{position:absolute;top:0;left:0;width:794px;height:1123px;background:#fff;transform-origin:top left;padding:42px 50px 24px;display:flex;flex-direction:column;font-size:17px;line-height:1.5;color:#222;text-align:left}
.a4body{flex:1 1 auto;min-height:0;overflow:hidden;display:block}
.a4foot{flex:none;height:22px;text-align:center;font-size:12px;color:#999}
.wshead{border-bottom:2.5px solid #333;padding-bottom:8px;margin-bottom:8px}
.wstitle{font-size:26px;font-weight:900;text-align:left;letter-spacing:2px}
.wshead.hasname{display:flex;align-items:flex-end;gap:12px}
.wshead.hasname>span{display:none}
.wshead.hasname .wstitle{flex:1 1 auto;min-width:0}
.wsname{flex:0 0 auto;text-align:right;font-size:17px;font-weight:700;white-space:nowrap;padding-bottom:3px}
.wsname u{display:inline-block;width:150px;text-decoration:none}
.wsinfo{display:flex;justify-content:center;gap:24px;margin-top:6px;font-size:16px;font-weight:700}
.wsinfo u{display:inline-block;width:70px;border-bottom:1.5px solid #333;text-decoration:none}
.wsinfo u.l{width:140px}
.keytag{background:#d9443a;color:#fff;font-size:16px;border-radius:6px;padding:1px 10px;margin-left:10px;vertical-align:middle;letter-spacing:0}
.wssec{font-size:18px;font-weight:900;margin:8px 0 5px;padding:3px 12px;background:#f3ece2;border-radius:6px}
.wsrow{display:grid;gap:8px;margin-bottom:6px}
.wsrow.c2{grid-template-columns:1fr 1fr}
.wsrow.c1{grid-template-columns:1fr}
.wsitem{border:1px solid #e3dacd;border-radius:10px;padding:6px 10px 8px;min-width:0}
.wsq{font-size:15px;color:#444}
.wsno{font-weight:900;color:#e2577a;margin-right:4px;font-size:18px}
.wsfig{text-align:center;margin:2px 0}
.wsfig svg{max-width:100%;max-height:100px;width:auto;height:auto}
.wsitem.t4 .wsfig svg{max-height:138px}
.wsprev.d1 .wsfig svg{max-height:86px}.wsprev.d1 .wsitem.t4 .wsfig svg{max-height:122px}.wsprev.d1 .wsitem{padding:4px 9px 6px}
.wsprev.d2 .wsfig svg{max-height:74px}.wsprev.d2 .wsitem.t4 .wsfig svg{max-height:108px}.wsprev.d2 .wsitem{padding:3px 8px 5px}.wsprev.d2 .wsrow{gap:6px;margin-bottom:4px}.wsprev.d2 .wssec{margin:5px 0 4px}
.wsline{display:flex;align-items:center;justify-content:center;gap:8px;font-size:19px;font-weight:700;flex-wrap:wrap;margin-top:2px}
.wsitem.t3{display:flex;align-items:center;gap:8px;padding:8px 12px}
.wsitem.t3 .wsline{margin:0;justify-content:flex-start}
.wb{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.wfr{display:inline-flex;flex-direction:column;align-items:center}
.bx{display:inline-grid;place-items:center;width:36px;height:30px;border:1.5px solid #999;border-radius:5px;font-size:18px;line-height:1}
.bx.bw{width:38px;height:42px;font-size:22px}
.wbar{width:46px;height:2px;background:#333;margin:3px 0}
.dfx{height:30px;display:grid;place-items:center;font-size:18px}
.wa{color:#d9443a;font-weight:900}
.wsitem.t0{display:flex;align-items:center;gap:6px;padding:6px 12px}
.t0body{flex:1;display:flex;align-items:center;gap:14px;min-width:0}
.t0lines{flex:1;min-width:0}
.t0lines .wsline{justify-content:flex-start;font-size:18px;margin:3px 0}
.wsfig.t0fig{flex:none;width:250px;margin:0}
.wsprev .wsfig.t0fig svg{max-height:52px}
.alab{font-size:18px;font-weight:900;fill:#d9443a;text-anchor:middle;dominant-baseline:central}

#wsImgOv{position:fixed;inset:0;z-index:50;background:#3a332e;overflow-y:auto;-webkit-overflow-scrolling:touch}
#wsImgOv .ovbar{display:flex;padding-right:110px !important;gap:12px;align-items:flex-start;background:#fff8d6;color:#4a3a00;padding:12px 16px;font-size:16px;line-height:1.6;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#wsImgOv .ovbar>div{flex:1}
#wsImgOv .ovx{position:fixed;top:10px;right:14px;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.35);border:none;background:#2f2a26;color:#fff;border-radius:999px;padding:6px 14px;font-size:16px;font-weight:900}
#wsImgOv .ovpages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px 12px 40px}
#wsImgOv figure{margin:0;width:100%;max-width:820px;text-align:center}

footer{max-width:1080px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:14px;text-align:center}
@media (max-width:640px){
  body{font-size:17px}
  h1{font-size:19px}
  .stext{font-size:19px}
  .card{padding:14px 12px}

}

<body>
<header>
  <div class="top">
    <h1>假分數與帶分數 互動教室</h1>
    <span class="sp"></span>
    <button class="sndbtn" id="sndBtn">🔔 音效：開</button>
  </div>
  <nav id="nav"></nav>
</header>

<main>
  <details class="concept">
    <summary>📌 先複習：真分數、假分數、帶分數</summary>
    <div class="cgrid">
      <div class="cbox c1"><b>真分數</b><br>分子比分母小，比 1 小。<br>例：<span id="cx1"></span></div>
      <div class="cbox c2"><b>假分數</b><br>分子大於或等於分母，等於 1 或比 1 大。<br>例：<span id="cx2"></span></div>
      <div class="cbox c3"><b>帶分數</b><br>整數和真分數合起來。<br>例：<span id="cx3"></span>（讀作「一又四分之一」）</div>
    </div>
  </details>
  <div id="units"></div>
</main>
<footer>每一題都是隨機出的，可以一直練習。點 🔊 可以聽講解。</footer>

<script>
/* ================= 工具 ================= */
const NS='http://www.w3.org/2000/svg';
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function S(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function frac(n,d,w){
  let h='<span class="mf">';
  if(w) h+=`<span class="w">${w}</span>`;
  if(n!==null&&n!==undefined&&n!==0) h+=`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;
  else if(!w) h+='<span class="w">0</span>';
  return h+'</span>';
}
const whole=w=>`<span class="mf"><span class="w">${w}</span></span>`;
document.getElementById('cx1').innerHTML=frac(3,4);
document.getElementById('cx2').innerHTML=frac(5,4)+'、'+frac(4,4);
document.getElementById('cx3').innerHTML=frac(1,4,1);

/* 語音 */
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang)&&!/HK|yue/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function toSpeech(html){
  const box=document.createElement('div');box.innerHTML=html;
  box.querySelectorAll('.mf').forEach(m=>{
    const w=m.querySelector('.w')?m.querySelector('.w').textContent:'';
    const n=m.querySelector('.n'),d=m.querySelector('.d');
    m.replaceWith(n?(w?w+'又':'')+d.textContent+'分之'+n.textContent:w);
  });
  return box.textContent.replace(/×/g,'成').replace(/乘/g,'成').replace(/÷/g,'除以').replace(/\+/g,'加').replace(/=/g,'等於').replace(/→/g,'，').replace(/[：:]/g,'，').replace(/[?□]/g,'幾').replace(/（\s*）/g,'括號').replace(/幾份/g,'擠份').replace(/(分|整|格|個|份|杯|盒|題|餘|指的)數|數(?=線|字|學|值|量|目)/g,m=>m.replace('數','\u0001')).replace(/數/g,'鼠').replace(/\u0001/g,'數').replace(/。[\s。]*/g,'。');
}
let speakId=0;
function stopSpeak(){speakId++;try{speechSynthesis.cancel();}catch(e){}}
function speak(html,onEnd){
  stopSpeak();const id=speakId;
  try{const u=new SpeechSynthesisUtterance(toSpeech(html));u.lang='zh-TW';if(voice)u.voice=voice;u.rate=.85;
    let bad=false;u.onerror=()=>{bad=true;};u.onend=()=>{if(!bad&&id===speakId&&onEnd)onEnd();};
    speechSynthesis.speak(u);}catch(e){}
}

function pulse(btn){if(!btn)return;btn.classList.remove('pulse');void btn.offsetWidth;btn.classList.add('pulse');const h=btn.previousElementSibling;if(h&&h.classList.contains('spkhint'))h.classList.add('live');}
document.addEventListener('click',e=>{const b=e.target.closest('.spk');if(b){b.classList.remove('pulse');const h=b.previousElementSibling;if(h&&h.classList.contains('spkhint'))h.classList.remove('live');}},true);
document.addEventListener('click',e=>{const h=e.target.closest('.spkhint');if(h&&h.nextElementSibling)h.nextElementSibling.click();});

/* 音效 */
let soundOn=true,actx=null;
document.getElementById('sndBtn').onclick=e=>{soundOn=!soundOn;e.target.textContent=soundOn?'🔔 音效：開':'🔕 音效：關';};
function chime(ok){
  if(!soundOn)return;
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
    (ok?[660,880,1320]:[330,262]).forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t+i*.11);g.gain.exponentialRampToValueAtTime(.16,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.11+.28);
      o.connect(g).connect(actx.destination);o.start(t+i*.11);o.stop(t+i*.11+.3);});
  }catch(e){}
}

/* 排版：一列放不下就換行 */
function flow(items,maxW,gap,pad){
  let x=pad,y=pad,rowH=0,W=0;const pos=[];
  items.forEach(it=>{if(x>pad&&x+it.w>maxW-pad){x=pad;y+=rowH+gap;rowH=0;}pos.push({x,y});x+=it.w+gap;rowH=Math.max(rowH,it.h);W=Math.max(W,x-gap+pad);});
  return {pos,W,H:y+rowH+pad};
}

/* ================= 圖形 ================= */
function drawCup(par,x,y,d,r){
  const w=64,h=96,g=S('g',{},par);
  const halo=S('rect',{x:x-8,y:y-8,width:w+16,height:h+16,rx:10,class:'halo'},g);
  const pieces=[];
  for(let i=0;i<d;i++){const y1=y+h-(i+1)*h/d,on=i<r;
    const el=S('rect',{x,y:y1,width:w,height:h/d,fill:on?'#bfe1f3':'#ffffff',class:'pc'+(on?' on':'')},g);
    pieces.push({el,cx:x+w/2+6,cy:y1+h/d/2,on});}
  for(let i=1;i<d;i++){const yy=y+h-i*h/d;S('line',{x1:x,y1:yy,x2:x+w,y2:yy,class:'faint'},g);S('line',{x1:x,y1:yy,x2:x+12,y2:yy,stroke:'#555','stroke-width':1.7},g);}
  if(r>0&&r<d)S('line',{x1:x,y1:y+h-r*h/d,x2:x+w,y2:y+h-r*h/d,stroke:'#3c95d1','stroke-width':2},g);
  S('path',{d:`M${x} ${y-4} L${x} ${y+h} L${x+w} ${y+h} L${x+w} ${y-4}`,fill:'none',stroke:'#444','stroke-width':2.2,class:'ol'},g);
  return {g,pieces,halo};
}
const boxSize=d=>({w:(d/2)*32+14,h:2*32+14});
function drawBox(par,x,y,d,r){
  const cols=d/2,s=boxSize(d),g=S('g',{},par);
  const halo=S('rect',{x:x-8,y:y-8,width:s.w+16,height:s.h+16,rx:10,class:'halo'},g);
  S('rect',{x,y,width:s.w,height:s.h,rx:4,fill:'#fff',stroke:'#444','stroke-width':2,class:'ol'},g);
  const pieces=[];
  for(let i=0;i<d;i++){const row=Math.floor(i/cols),col=i%cols,cx=x+7+col*32+16,cy=y+7+row*32+16,on=i<r;
    const el=S('ellipse',{cx,cy,rx:13.5,ry:11.5,fill:on?'#f5bfcf':'#fff',stroke:'#444','stroke-width':1.4,class:'pc'+(on?' on':'')},g);
    pieces.push({el,cx,cy,on});}
  return {g,pieces,halo};
}
function drawPie(par,x,y,d,r,color){
  const R=56,cx=x+R+2,cy=y+R+2,g=S('g',{},par);
  const halo=S('circle',{cx,cy,r:R+7,class:'halo'},g);
  const pt=(a,rr)=>[cx+rr*Math.cos(a*Math.PI/180),cy+rr*Math.sin(a*Math.PI/180)];
  const pieces=[];
  for(let i=0;i<d;i++){const a0=-90+i*360/d,a1=a0+360/d,[x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),on=i<r;
    const el=S('path',{d:`M${cx} ${cy} L${x0} ${y0} A${R} ${R} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1} Z`,fill:on?color:'#fff',class:'pc'+(on?' on':'')},g);
    const [mx,my]=pt((a0+a1)/2,R*(d<=2?.45:.62));pieces.push({el,cx:mx,cy:my,on});}
  if(d>1)for(let i=0;i<d;i++){const [x0,y0]=pt(-90+i*360/d,R);S('line',{x1:cx,y1:cy,x2:x0,y2:y0,class:'dash'},g);}
  S('circle',{cx,cy,r:R,fill:'none',stroke:'#555','stroke-width':2,class:'ol'},g);
  return {g,pieces,halo};
}
const RG={2:[2,1],3:[3,1],4:[2,2],5:[5,1],6:[3,2],8:[4,2],10:[5,2],12:[4,3]};
function drawRect(par,x,y,d,r,color){
  const W=120,Hh=90,[c,rw]=RG[d],cw=W/c,ch=Hh/rw,g=S('g',{},par);
  const halo=S('rect',{x:x-8,y:y-8,width:W+16,height:Hh+16,rx:10,class:'halo'},g);
  const pieces=[];
  for(let i=0;i<d;i++){const row=Math.floor(i/c),col=i%c,px=x+col*cw,py=y+row*ch,on=i<r;
    const el=S('rect',{x:px,y:py,width:cw,height:ch,fill:on?color:'#fff',class:'pc'+(on?' on':'')},g);
    pieces.push({el,cx:px+cw/2,cy:py+ch/2,on});}
  for(let i=1;i<c;i++)S('line',{x1:x+i*cw,y1:y,x2:x+i*cw,y2:y+Hh,class:'dash'},g);
  for(let j=1;j<rw;j++)S('line',{x1:x,y1:y+j*ch,x2:x+W,y2:y+j*ch,class:'dash'},g);
  S('rect',{x,y,width:W,height:Hh,fill:'none',stroke:'#555','stroke-width':2,class:'ol'},g);
  return {g,pieces,halo};
}
const DRAW={cup:drawCup,box:drawBox,pie:drawPie,rect:drawRect};
function renderShapes(holder,kind,d,w,r,opt={}){
  holder.innerHTML='';
  const n=w+(r>0?1:0);
  const sz={cup:{w:64,h:96},box:boxSize(d),pie:{w:116,h:116},rect:{w:120,h:90}}[kind];
  const L=flow(Array.from({length:n},()=>({w:sz.w+16,h:sz.h+16})),opt.maxW||720,12,6);
  const svg=S('svg',{viewBox:`0 0 ${L.W} ${L.H}`,width:L.W,height:L.H,class:'fig'});
  const sg=S('g',{},svg),labels=S('g',{class:'labels'},svg),shapes=[];
  for(let i=0;i<n;i++){const p=L.pos[i];shapes.push(DRAW[kind](sg,p.x+8,p.y+8,d,i<w?d:r,opt.color));}
  holder.appendChild(svg);
  const onPieces=[].concat(...shapes.map(s=>s.pieces.filter(p=>p.on)));
  return {svg,shapes,labels,onPieces};
}
function numberPieces(f,list,start=1){list.forEach((p,i)=>{p.el.classList.add('counted');const t=S('text',{x:p.cx,y:p.cy,class:'num'},f.labels);t.textContent=start+i;});}
function countTools(tools,f,part){
  tools.innerHTML=`<span>👆 點有顏色的地方，一起數一數</span><span class="cnt">已數：<b>0</b> ${part}</span><button class="sm rs">↺ 重數</button>`;
  const cnt=tools.querySelector('.cnt b');let c=0;
  f.onPieces.forEach(p=>p.el.addEventListener('click',()=>{if(p.el.classList.contains('counted'))return;c++;p.el.classList.add('counted');const t=S('text',{x:p.cx,y:p.cy,class:'num'},f.labels);t.textContent=c;cnt.textContent=c;}));
  tools.querySelector('.rs').onclick=()=>{c=0;cnt.textContent=0;f.labels.innerHTML='';f.onPieces.forEach(p=>p.el.classList.remove('counted'));};
}

/* 長條（數字轉換用） */
function drawBars(holder,w,r,d,o={}){
  holder.innerHTML='';
  const cell=Math.min(38,Math.floor(560/d)),bw=cell*d,bh=40,n=w+(r>0?1:0);
  const L=flow(Array.from({length:n},()=>({w:bw+16,h:bh+16})),720,8,4);
  const svg=S('svg',{viewBox:`0 0 ${L.W} ${L.H}`,width:L.W,height:L.H,class:'fig'});
  const labels=S('g',{class:'labels'});
  const on=[];
  for(let i=0;i<n;i++){const p=L.pos[i],x=p.x+8,y=p.y+8,filled=i<w?d:r;
    if(o.hl&&i<w)S('rect',{x:x-6,y:y-6,width:bw+12,height:bh+12,rx:9,class:'halo show'},svg);
    for(let j=0;j<d;j++){const isOn=j<filled;
      const fill=isOn?(o.color||(o.plain?'#fbd6b5':(i<w?'#fbd6b5':'#bfe1f3'))):'#fff';
      S('rect',{x:x+j*cell,y,width:cell,height:bh,fill,stroke:'#c9b8a6','stroke-width':1},svg);
      if(isOn)on.push({cx:x+j*cell+cell/2,cy:y+bh/2});}
    S('rect',{x,y,width:bw,height:bh,fill:'none',stroke:'#555','stroke-width':2},svg);
  }
  svg.appendChild(labels);
  const upto=o.num||0;
  on.slice(0,upto).forEach((c,i)=>{const t=S('text',{x:c.cx,y:c.cy,class:'num',style:cell<26?'font-size:12px':''},labels);t.textContent=i+1;});
  holder.appendChild(svg);
}

/* 數線 */
function drawLine(holder,o){
  holder.innerHTML='';
  const k=o.k||0,L=o.L,d=o.d,T=L*d,x0=44,x1=700,W=760,Hh=(o.fracLabels?182:160)+(o.arrowLabels?26:0)-(o.compact?18:0),y=80;
  const X=t=>x0+(x1-x0)*t/T,sw=(x1-x0)/T;
  const svg=S('svg',{viewBox:`0 0 ${W} ${Hh}`,width:W,height:Hh,class:'fig nl'});
  if(o.hl)for(let t=o.hl.from;t<o.hl.to;t++){
    S('rect',{x:X(t)+1,y:y-8,width:sw-2,height:16,rx:3,fill:(t-o.hl.from)%2?'#fcd9b8':'#f6b47c'},svg);
    const tx=S('text',{x:X(t)+sw/2,y:y-18,class:'segn'},svg);tx.textContent=t-o.hl.from+1;}
  S('line',{x1:x0-14,y1:y,x2:x1+36,y2:y,stroke:'#333','stroke-width':2.4},svg);
  S('path',{d:`M${x1+48} ${y} l-14 -7 v14 z`,fill:'#333'},svg);
  for(let t=0;t<=T;t++){const big=t%d===0,x=X(t);
    S('line',{x1:x,y1:y-(big?14:8),x2:x,y2:y+(big?14:8),stroke:'#333','stroke-width':big?2.4:1.5},svg);
    if(big){const v=k+t/d;
      if(o.emph===v)S('circle',{cx:x,cy:y-40,r:15,fill:'#ffe9a8',stroke:'#e57e2c','stroke-width':2},svg);
      const lb=S('text',{x,y:y-40,class:'ilab'},svg);lb.textContent=v;
      if(o.fracLabels){
        if(v===0){const z=S('text',{x,y:y+38,class:'flab'},svg);z.textContent='0';}
        else{const nn=S('text',{x,y:y+31,class:'flab'},svg);nn.textContent=v*d;S('line',{x1:x-11,y1:y+40,x2:x+11,y2:y+40,stroke:'#555','stroke-width':1.6},svg);const dd=S('text',{x,y:y+52,class:'flab'},svg);dd.textContent=d;}
      }}
  }
  (o.arrows||[]).forEach((t,i)=>{const x=X(t),yb=o.fracLabels?y+96:y+(o.compact?54:72);
    S('line',{x1:x,y1:yb,x2:x,y2:y+28,stroke:'#d9443a','stroke-width':3},svg);
    S('path',{d:`M${x} ${y+17} l-7 13 h14 z`,fill:'#d9443a'},svg);
    S('circle',{cx:x,cy:y,r:6.5,fill:'#d9443a',stroke:'#fff','stroke-width':2},svg);
    if(o.arrowLabels){const lt=S('text',{x,y:yb+16,class:'alab'},svg);lt.textContent=o.arrowLabels[i];}});
  if(o.clickSeg)for(let t=0;t<T;t++){const h=S('rect',{x:X(t),y:y-30,width:sw,height:48,class:'hit'},svg);h.addEventListener('click',()=>o.clickSeg(t));}
  if(o.clickTick)for(let t=0;t<=T;t++){const hw=Math.min(sw,28);const h=S('rect',{x:X(t)-hw/2,y:y-30,width:hw,height:62,class:'hit tick'},svg);h.addEventListener('click',()=>o.clickTick(t));}
  if(o.markerOk!=null){const x=X(o.markerOk);S('circle',{cx:x,cy:y,r:10,fill:'#4f9a41',stroke:'#fff','stroke-width':2},svg);const t=S('text',{x,y:y+44,class:'mlab'},svg);t.textContent='正確位置';}
  if(o.marker!=null){const x=X(o.marker);S('circle',{cx:x,cy:y,r:8,fill:'#3c95d1',stroke:'#fff','stroke-width':2,'pointer-events':'none'},svg);S('path',{d:`M${x} ${y-12} l-8 -14 h16 z`,fill:'#3c95d1','pointer-events':'none'},svg);}
  holder.appendChild(svg);
}

/* ================= 作答框 ================= */
function ansBox(a){
  if(a.single)return `<span class="ab one"><svg class="okmark" viewBox="0 0 100 80" aria-hidden="true"><path d="M10 44 L38 70 L92 10"/></svg><input class="in single" inputmode="numeric" maxlength="3" aria-label="答案"></span>`;
  return `<span class="ab"><svg class="okmark" viewBox="0 0 100 80" aria-hidden="true"><path d="M10 44 L38 70 L92 10"/></svg>${a.whole?'<input class="iw" inputmode="numeric" maxlength="3" aria-label="整數">':''}<span class="frin"><input class="in" inputmode="numeric" maxlength="3" aria-label="分子"><span class="bar"></span>${a.den?`<span class="dfix">${a.den}</span>`:'<input class="id" inputmode="numeric" maxlength="3" aria-label="分母">'}</span></span>`;
}
function readBox(c){
  const g=s=>{const e=c.querySelector(s);if(!e)return undefined;return e.value===''?NaN:parseInt(e.value,10);};
  const fx=c.querySelector('.dfix');
  const v={w:g('.iw'),n:g('.in'),d:fx?parseInt(fx.textContent,10):g('.id')};
  if([v.w,v.n,v.d].some(x=>Number.isNaN(x)))return null;
  return v;
}

/* ================= 單元架構 ================= */
const unitsEl=document.getElementById('units'),navEl=document.getElementById('nav');
const UNITS=[];
function setupUnit(cfg){
  const idx=UNITS.length+1;UNITS.push(cfg);
  navEl.insertAdjacentHTML('beforeend',`<a href="#unit${idx}" data-u="${idx}"><span class="no">${idx}</span><span class="nt"><b>${cfg.nav[0]}</b><small>${cfg.nav[1]}</small></span></a>`);
  const sec=document.createElement('section');sec.className='unit';sec.id='u'+idx;
  sec.innerHTML=`
    <div class="intro"><h2>${cfg.title}</h2><p>${cfg.desc}</p></div>
    <div class="modebar"><button class="mode on" data-m="learn">📖 看講解</button><button class="mode" data-m="practice">✏️ 動手練習</button></div>
    <div class="card learn">
      <div class="opts">${cfg.learnOpts?'例子：'+cfg.learnOpts.map((o,i)=>`<button class="opt${i?'':' on'}" data-v="${o[0]}">${o[1]}</button>`).join(''):''}<button class="newex">🎲 換一個例子</button></div>
      <div class="lfig figwrap"></div>
      <div class="stepbox"><span class="stepno"></span><div class="stext"></div><span class="spkhint">按這裡聽內容 👉</span><button class="spk" title="念給我聽">🔊</button></div>
      <div class="ctrl"><button class="prev">◀ 上一步</button><div class="dots"></div><button class="next">下一步 ▶</button></div>
    </div>
    <div class="card practice" hidden>
      <div class="opts">${cfg.pracOpts.map((o,i)=>`<button class="opt${i?'':' on'}" data-v="${o[0]}">${o[1]}</button>`).join('')}<span class="score"></span></div>
      <div class="qhead"><span class="qno"></span><span class="qtext"></span><span class="spkhint">按這裡聽內容 👉</span><button class="spk sm" title="念題目">🔊</button></div>
      <div class="qfig figwrap"></div>
      <div class="qtools"></div>
      <div class="qwork">
        <div class="qleft">
          <div class="qans"></div>
          <div class="qbtns"><button class="check">✔ 對答案</button><button class="hint">💡 提示</button><button class="show" hidden>👀 看解答</button><button class="nextq">下一題 ➜</button></div>
        </div>
        <div class="fb" aria-live="polite"></div>
      </div>
    </div>`;
  unitsEl.appendChild(sec);
  const $=s=>sec.querySelector(s);
  // 模式切換
  sec.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{
    sec.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));
    $('.learn').hidden=b.dataset.m!=='learn';$('.practice').hidden=b.dataset.m!=='practice';
    if(b.dataset.m==='practice'&&!started){started=true;newQ();}
    sec.querySelectorAll('.card:not([hidden]) .spk').forEach(pulse);
  });
  /* --- 講解 --- */
  let steps=[],si=0;
  const L=$('.learn');
  function showStep(){
    stopSpeak();L.querySelector('.next').classList.remove('glow');
    const s=steps[si];s.draw(L.querySelector('.lfig'));
    L.querySelector('.stext').innerHTML=s.text;
    L.querySelector('.stepno').textContent=`第 ${si+1} 步`;
    L.querySelector('.dots').innerHTML=steps.map((_,k)=>`<span class="${k===si?'on':k<si?'done':''}"></span>`).join('');
    L.querySelector('.prev').disabled=si===0;
    L.querySelector('.next').textContent=si===steps.length-1?'再看一次 ↺':'下一步 ▶';
    pulse(L.querySelector('.spk'));
  }
  function loadSteps(){steps=cfg.steps();si=0;showStep();}
  L.querySelector('.prev').onclick=()=>{if(si>0){si--;showStep();}};
  L.querySelector('.next').onclick=()=>{si=si<steps.length-1?si+1:0;showStep();};
  L.querySelector('.spk').onclick=()=>{L.querySelector('.next').classList.remove('glow');speak(steps[si].text+'<br>。你有聽懂嗎？沒有的話，再從頭聽一次。',()=>L.querySelector('.next').classList.add('glow'));};
  L.querySelector('.newex').onclick=()=>{cfg.newEx();loadSteps();};
  L.querySelectorAll('.opts .opt').forEach(b=>b.onclick=()=>{
    L.querySelectorAll('.opts .opt').forEach(x=>x.classList.toggle('on',x===b));cfg.learnOpt(b.dataset.v);cfg.newEx();loadSteps();});
  cfg.newEx();loadSteps();
  /* --- 練習 --- */
  const P=$('.practice');
  let q=null,tries=0,done=false,qn=0,right=0,total=0,started=false;
  const fb=P.querySelector('.fb'),showBtn=P.querySelector('.show');
  function setScore(){P.querySelector('.score').innerHTML=`⭐ 一次就答對 ${right} 題 ／ 做完 ${total} 題`;}
  function newQ(){
    q=cfg.gen();tries=0;done=false;qn++;
    P.querySelector('.qno').textContent=`第 ${qn} 題`;
    P.querySelector('.qtext').innerHTML=q.prompt;
    const fig=P.querySelector('.qfig'),tools=P.querySelector('.qtools');fig.innerHTML='';tools.innerHTML='';
    if(q.draw)q.draw(fig,tools);
    const qa=P.querySelector('.qans');
    qa.className='qans';qa.innerHTML=(q.pre||'')+(q.ans?ansBox(q.ans):'<svg class="okmark" viewBox="0 0 100 80" aria-hidden="true"><path d="M10 44 L38 70 L92 10"/></svg>')+(q.post||'');
    // 填答順序：分母 → 整數 → 分子（前一格填好，下一格才打開）
    const order=['.id','.iw','.in'].map(x=>qa.querySelector(x)).filter(Boolean);
    const upd=()=>{let open=true,glow=false;order.forEach(inp=>{
      inp.disabled=!open;inp.classList.toggle('locked',!open);
      const g=open&&!glow&&inp.value==='';inp.classList.toggle('nextfill',g);if(g)glow=true;
      if(inp.value==='')open=false;});};
    order.forEach((inp,i)=>{
      inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'');upd();});
      inp.addEventListener('keydown',e=>{if(e.key!=='Enter')return;e.preventDefault();
        const nx=order.slice(i+1).find(x=>x.value==='');if(inp.value!==''&&nx){nx.focus();}else check();});
    });
    upd();
    fb.className='fb';fb.innerHTML='';showBtn.hidden=true;setScore();
    pulse(P.querySelector('.qhead .spk'));
    const first=order[0];if(first&&window.matchMedia('(pointer:fine)').matches)first.focus();
  }
  function finish(){if(!done){done=true;total++;setScore();}}
  function check(){
    const v=q.ans?readBox(P.querySelector('.qans')):q.getVals();
    if(!v){fb.className='fb info';fb.innerHTML=q.emptyMsg||'請先把每個空格都填好喔！';return;}
    if(done&&q.locked)return;
    tries++;
    const res=q.check(v);
    if(res.ok){
      if(!done&&tries===1)right++;
      finish();chime(true);if(q.reveal)q.reveal();P.querySelector('.qans').classList.add('ok');
      fb.className='fb good';fb.innerHTML=`<span class="ttl">${pick(['答對了！','好棒！','完全正確！','太厲害了！'])}</span><span class="stars">${tries===1?'⭐⭐⭐':tries===2?'⭐⭐':'⭐'}</span><br>${q.solution}`;
    }else{
      chime(false);
      fb.className='fb bad';fb.innerHTML=`<span class="ttl">再想想看 🤔</span>${res.msg}`;
      if(tries>=2)showBtn.hidden=false;
    }
  }
  P.querySelector('.check').onclick=check;
  P.querySelector('.nextq').onclick=newQ;
  P.querySelector('.hint').onclick=()=>{fb.className='fb info';fb.innerHTML=`<span class="ttl">💡 提示</span><br>${q.hint}`;};
  showBtn.onclick=()=>{finish();if(q.reveal)q.reveal();fb.className='fb info';fb.innerHTML=`<span class="ttl">👀 解答</span><br>${q.solution}`;};
  P.querySelector('.qhead .spk').onclick=()=>speak(P.querySelector('.qtext').innerHTML+'。'+(q.speakExtra||''));
  P.querySelectorAll('.opts .opt').forEach(b=>b.onclick=()=>{
    P.querySelectorAll('.opts .opt').forEach(x=>x.classList.toggle('on',x===b));cfg.pracOpt(b.dataset.v);newQ();});
}

/* 看圖題共用的判斷 */
function checkPic(v,o){
  const {type,w,r,d,U,P,full}=o,N=w*d+r;
  const denMsg=()=>(v.d&&v.n!==undefined&&v.n*d===(type==='mixed'?r:N)*v.d)
      ?`大小一樣，但請照圖上的分法，分母用 <b>${d}</b>。`
      :`分母不對喔。1 ${U}被平分成幾${P}？分母就是平分的份數。`;
  if(type==='mixed'){
    if(v.w===w&&v.n===r&&v.d===d)return{ok:true};
    if(v.d!==d)return{msg:denMsg()};
    if(v.w!==w)return{msg:`整數部分不對。數一數，<b>${full}</b>的有幾${U}？`};
    if(v.n>=d)return{msg:`帶分數的分子要比分母小喔！最後一${U}只有幾${P}？`};
    return{msg:`分子不對。看最後一${U}，有顏色的有幾${P}？`};
  }else{
    if(v.n===N&&v.d===d)return{ok:true};
    if(v.d!==d)return{msg:denMsg()};
    if(r>0&&v.n===r)return{msg:`只數了最後一${U}喔！${full}的也要算進去。`};
    if(v.n===w+r||v.n===w)return{msg:`${full}的 1 ${U}不是 1 ${P}，而是 ${d} ${P}喔！`};
    if(v.n<d)return{msg:`假分數的分子要大於或等於分母喔。再數一次所有有顏色的${P}。`};
    return{msg:`分子不對。每${U}有 ${d} ${P}，${w} ${U}是幾${P}？${r?'再加上最後一'+U+'的'+P+'數。':''}可以用「點一點」幫忙數。`};
  }
}

/* ================= 單元 1：單位分數與累加 ================= */
let ex0={},prac0='all';
const UCOL=['#f5b8cc','#bfe3b0','#f7dc8a','#bfe1f3'];
const plusSum=(n,d)=>`<span class="sumline">${Array(n).fill(frac(1,d)).join('<span class="pl">+</span>')}</span>`;
setupUnit({
  nav:['單位分數','幾個幾分之一'],
  title:'① 單位分數：幾個幾分之一合起來',
  desc:'1 條平分成幾格，1 格就是「幾分之一」。數一數有幾個，就能寫出分數，也能用加法算。',
  learnOpts:null,
  newEx(){const d=rnd(4,8);ex0={d,n:rnd(2,d-1),color:pick(UCOL)};},
  steps(){
    const {d,n,color}=ex0;
    const one=fig=>drawBars(fig,0,1,d,{color,num:1}),many=fig=>drawBars(fig,0,n,d,{color,num:n});
    return [
      {text:`把 1 條平分成 <b class="hd">${d}</b> 格，每 1 格是 ${frac(1,d)}。<br>像 ${frac(1,d)} 這樣分子是 1 的分數，叫做<b>單位分數</b>。`,draw:one},
      {text:`1 個 ${frac(1,d)} 塗 1 格，2 個 ${frac(1,d)} 塗 2 格……<br><b class="hn">${n}</b> 個 ${frac(1,d)} 就塗 <b class="hn">${n}</b> 格。`,draw:many},
      {text:`<b class="hn">${n}</b> 個 ${frac(1,d)} 合起來是 ${frac(n,d)}。<br>分母 ${d} 是「平分成幾格」，分子 ${n} 是「有幾個 ${frac(1,d)}」。`,draw:many},
      {text:`也可以寫成加法：<br>${plusSum(n,d)} = ${frac(n,d)}<br>分母不變，${n} 個 1 加起來，分子就是 ${n}。`,draw:many},
      {text:`如果 ${d} 個 ${frac(1,d)} 合起來，就塗滿一整條：<br>${frac(d,d)}，也就是 <b>1</b>。`,draw:fig=>drawBars(fig,1,0,d,{color,num:d,hl:true})},
      {text:`再多幾個也可以！${d+2} 個 ${frac(1,d)} 合起來是 ${frac(d+2,d)}，比 1 還大。<br>分子比分母大的分數，就是後面要學的<b>假分數</b>。`,draw:fig=>drawBars(fig,1,2,d,{color,num:d+2,hl:true})}
    ];
  },
  pracOpts:[['all','全部'],['howmany','是幾個幾分之一'],['count','幾個幾分之一合起來'],['add','連加算式'],['over','超過 1']],
  pracOpt:v=>{prac0=v;},
  gen(){
    const m=prac0==='all'?pick(['count','count','howmany','howmany','add','add','over']):prac0,color=pick(UCOL);
    let d,n;
    if(m==='over'){d=rnd(2,6);n=rnd(d+1,2*d+2);}
    else if(m==='add'){d=rnd(3,10);n=rnd(2,Math.min(d,7));}
    else{d=rnd(3,10);n=rnd(2,d);}
    const W=Math.floor(n/d),R=n%d;
    if(m==='howmany'){
      const front=Math.random()<.5;
      return{
        prompt:'看圖填填看。',
        draw(fig,tools){
          drawBars(fig,W,R,d,{color});
          tools.innerHTML='<button class="sm hb">🔢 幫我數格子</button>';
          tools.querySelector('.hb').onclick=e=>{e.target.classList.add('on');drawBars(fig,W,R,d,{color,num:n});};
        },
        ans:{single:true},
        pre:front?'':`${frac(n,d)} 是`,
        post:front?`個 ${frac(1,d)} 合起來是 ${frac(n,d)}`:`個 ${frac(1,d)}`,
        check(v){
          if(v.n===n)return{ok:true};
          if(v.n===d)return{msg:`${d} 是分母（1 條平分成幾格）。題目問的是：有幾個 ${frac(1,d)}？數一數塗色的格子。`};
          if(v.n===1)return{msg:`1 個 ${frac(1,d)} 只有 1 格喔！數一數一共塗了幾格？`};
          return{msg:`再數一次塗色的格子，1 格就是 1 個 ${frac(1,d)}。（可以按「幫我數格子」）`};
        },
        hint:`1 格就是 1 個 ${frac(1,d)}。<br>數一數塗了幾格，或看 ${frac(n,d)} 的分子。`,
        solution:`${frac(n,d)} 是 ${n} 個 ${frac(1,d)}，塗了 ${n} 格。`
      };
    }
    return{
      prompt:m==='add'?'看圖算算看，答案寫成分數。':'看圖填填看。',
      draw(fig,tools){
        drawBars(fig,W,R,d,{color});
        tools.innerHTML='<button class="sm hb">🔢 幫我數格子</button>';
        tools.querySelector('.hb').onclick=e=>{e.target.classList.add('on');drawBars(fig,W,R,d,{color,num:n});};
      },
      ans:{},
      pre:m==='add'?`${plusSum(n,d)} =`:`${n} 個 ${frac(1,d)} 合起來是`,
      check(v){
        if(v.n===n&&v.d===d)return{ok:true};
        if(v.d===n*d)return{msg:`分母不要加起來喔！每一個都是 ${frac(1,d)}，分母一直都是 ${d}。`};
        if(v.d!==d){
          if(v.n*d===n*v.d)return{msg:`大小一樣，但請照圖上的分法，分母用 ${d}。`};
          return{msg:`分母不對。1 條被平分成幾格？分母就是平分的格數。`};
        }
        if(v.n===1)return{msg:`${frac(1,d)} 只是 1 格。有 ${n} 個 ${frac(1,d)}，分子要數全部喔！`};
        return{msg:`分子不對。數一數塗了幾格？（可以按「幫我數格子」）`};
      },
      hint:m==='add'
        ?`數一數有幾個 ${frac(1,d)} 加起來 → 分子<br>分母不變，還是 ${d}。`
        :`1 條平分成幾格？→ 分母<br>有幾個 ${frac(1,d)}？→ 分子`,
      solution:`${n} 個 ${frac(1,d)} 合起來是 ${frac(n,d)}${n===d?'，也就是 1':''}${n>d?'，比 1 大，是假分數':''}。`
    };
  }
});

let ex3={mode:'mix'},prac3='all';
setupUnit({

  title:'④ 數字轉換：整數、帶分數 ⇄ 假分數',

  newEx(){const m=ex3.mode,d=rnd(3,6);ex3={mode:m,d,w:m==='int'?rnd(2,4):rnd(1,3),r:m==='int'?0:rnd(1,d-1)};},

      {text:`1 = ${frac(d,d)}，所以 ${w} 個 1 = <b>${w} × ${d} = ${w*d}</b> 份。`,draw:fig=>drawBars(fig,w,r,d,{num:w*d,hl:true})},

      {text:`分母不變，還是 ${d}。<div class="sum">${frac(r,d,w)} = ${frac(N,d)}</div>`,draw:fig=>drawBars(fig,w,r,d,{num:N,hl:true})}
    ];
    return[
      {text:`${frac(N,d)} 表示有 ${N} 個 ${frac(1,d)}。`,draw:fig=>drawBars(fig,w,r,d,{num:N,plain:true})},
      {text:`每 ${d} 個 ${frac(1,d)} 可以湊成 1 個 1。用除法算：<b>${N} ÷ ${d} = ${w} 餘 ${r}</b>。`,draw:fig=>drawBars(fig,w,r,d,{num:N,hl:true})},
      {text:`湊成 <b class="hw">${w}</b> 個 1，還剩 <b class="hn">${r}</b> 個 ${frac(1,d)}。<div class="sum">${frac(N,d)} = ${frac(r,d,w)}</div>`,draw:fig=>drawBars(fig,w,r,d,{num:N,hl:true})}
    ];
  },
  pracOpts:[['all','全部'],['int','整數 → 假分數'],['mix','帶分數 → 假分數'],['imp','假分數 → 帶分數（挑戰）']],
  pracOpt:v=>{prac3=v;},
  gen(){
    const m=prac3==='all'?pick(['int','mix','mix','imp']):prac3;
    const helpBtn=(w,r,d)=>(fig,tools)=>{tools.innerHTML='<button class="sm hb">🧩 畫圖幫我想</button>';tools.querySelector('.hb').onclick=e=>{e.target.classList.add('on');drawBars(fig,w,r,d,{hl:true});};};
    if(m==='int'){const d=rnd(2,9),w=rnd(2,9),N=w*d;
      return{prompt:'把整數換成假分數。',pre:`<span class="bigw">${w}</span> =`,ans:{den:d},draw:helpBtn(w,0,d),
        check:v=>v.n===N?{ok:true}:v.n===w+d?{msg:`不是用加的喔！1 = ${frac(d,d)}，${w} 個 1 要用乘的：${w} × ${d}。`}:v.n===w?{msg:`要換成「${d} 分之幾」。每個 1 = ${frac(d,d)}，${w} 個 1 是幾份？`}:{msg:`再算一次：${w} × ${d} = ?`},
        hint:`每 1 = ${frac(d,d)}，${w} 個 1 = ${w} × ${d} = □`,
        solution:`${w} × ${d} = ${N} → ${w} = ${frac(N,d)}`};}
    if(m==='mix'){const d=rnd(3,12),w=rnd(1,6),r=rnd(1,d-1),N=w*d+r;
      return{prompt:'把帶分數換成假分數。',pre:`<span class="bigw">${frac(r,d,w)}</span> =`,ans:{},draw:helpBtn(w,r,d),

          if(v.d!==d)return{msg:`分母不變喔！還是 <b>${d}</b>。`};
          if(v.n===w*d)return{msg:`快好了！${w} × ${d} 之後，別忘了再加上分子 ${r}。`};
          if(v.n===w+r||v.n===w*r||v.n===w+d+r)return{msg:`整數要先乘分母：${w} × ${d}，再加上分子 ${r}。`};
          return{msg:`再算一次：${w} × ${d} + ${r} = ?`};},
        hint:`整數 × 分母 + 分子：${w} × ${d} + ${r} = □，分母不變，還是 ${d}。`,
        solution:`${w} × ${d} + ${r} = ${N} → ${frac(r,d,w)} = ${frac(N,d)}`};}
    const d=rnd(2,9),w=rnd(1,5),r=rnd(1,d-1),N=w*d+r;
    return{prompt:'把假分數換成帶分數。',pre:`<span class="bigw">${frac(N,d)}</span> =`,ans:{whole:true},draw:helpBtn(w,r,d),

        if(v.w!==w)return{msg:`整數不對。算算看：${N} ÷ ${d} 的商是多少？`};

      hint:`分子 ÷ 分母：${N} ÷ ${d} = □ 餘 □<br>商是整數、餘數是分子，分母不變。`,
      solution:`${N} ÷ ${d} = ${w} 餘 ${r} → ${frac(N,d)} = ${frac(r,d,w)}`};
  }

/* ================= 單元 4：數線 ================= */
let ex4={},prac4='all';
function genP(L,d){let p;do{p=rnd(d+1,L*d-1);}while(p%d===0);return p;}
setupUnit({
  nav:['數線','寫分數、標位置'],
  title:'⑤ 數線：寫出假分數、帶分數',
  desc:'先看 0 到 1 之間分成幾小格（分母），再從 0 數到箭頭有幾小格（分子）。',
  learnOpts:null,
  newEx(){const L=pick([3,4]),d=pick([3,4,5]);ex4={L,d,p:genP(L,d)};},
  steps(){
    const {L,d,p}=ex4,w=Math.floor(p/d),r=p%d,base={k:0,L,d,arrows:[p]};
    return[
      {text:`紅色箭頭指在哪裡？先看 0 到 1 之間：一共被平分成 <b class="hd">${d}</b> 小格，所以每 1 小格是 ${frac(1,d)}。`,draw:fig=>drawLine(fig,{...base,hl:{from:0,to:d}})},
      {text:`小提醒：要數的是「小格」（兩條刻度線中間的空格），<b>不是數刻度線</b>喔！`,draw:fig=>drawLine(fig,{...base,hl:{from:0,to:d}})},
      {text:`從 0 開始，一小格一小格往右數到箭頭：一共 <b class="hn">${p}</b> 小格 → ${p} 個 ${frac(1,d)} → 假分數 ${frac(p,d)}。`,draw:fig=>drawLine(fig,{...base,hl:{from:0,to:p}})},
      {text:`在整數下面寫上分數更清楚：1 = ${frac(d,d)}、2 = ${frac(2*d,d)}……<br>箭頭比 ${frac(w*d,d)} 再多 ${r} 小格，就是 ${frac(p,d)}。`,draw:fig=>drawLine(fig,{...base,fracLabels:true,hl:{from:w*d,to:p}})},
      {text:`也可以寫成帶分數：箭頭在 <b class="hw">${w}</b> 和 ${w+1} 之間，從 ${w} 再往右數 <b class="hn">${r}</b> 小格 → ${frac(r,d,w)}。`,draw:fig=>drawLine(fig,{...base,hl:{from:w*d,to:p},emph:w})},
      {text:`<div class="sum">${frac(p,d)} = ${frac(r,d,w)}</div><br>同一個位置，可以用假分數，也可以用帶分數表示。`,draw:fig=>drawLine(fig,{...base,fracLabels:true,emph:w})}
    ];
  },
  pracOpts:[['all','全部'],['imp','寫假分數'],['mix','寫帶分數'],['place','在數線上標出位置']],
  pracOpt:v=>{prac4=v;},
  gen(){
    const m=prac4==='all'?pick(['imp','mix','place']):prac4;
    if(m!=='place'){
      // 一半從 0 開始，一半從中間的整數開始
      const k=Math.random()<.5?0:rnd(1,3),L=k?3:rnd(3,5),d=pick([2,3,4,5,6]);
      let p;do{p=rnd(Math.max(k*d,d)+1,(k+L)*d-1);}while(p%d===0);
      const w=Math.floor(p/d),r=p%d,t0=p-k*d,seg=`${k} 到 ${k+1} 之間`;
      return{
        prompt:`看數線，紅色箭頭指的數用 <b class="${m==='mix'?'tm':'ti'}">${m==='mix'?'帶分數':'假分數'}</b> 表示。`,
        draw(fig,tools){
          const st={fl:false,hl:null};
          tools.innerHTML=`<button class="sm tg">🏷️ 顯示分數刻度</button><span>👆 點數線上的小格，會從 ${k} 數到那一格</span><span class="info"></span>`;
          const info=tools.querySelector('.info'),tg=tools.querySelector('.tg');
          const re=()=>drawLine(fig,{k,L,d,arrows:[t0],fracLabels:st.fl,hl:st.hl,clickSeg:t=>{st.hl={from:0,to:t+1};info.innerHTML=`從 ${k} 數到這一格：${t+1} 小格`;re();}});
          tg.onclick=()=>{st.fl=!st.fl;tg.classList.toggle('on',st.fl);re();};
          re();
        },
        ans:{whole:m==='mix'},pre:'箭頭指的是',
        check:v=>{
          const ok=m==='mix'?(v.w===w&&v.n===r&&v.d===d):(v.n===p&&v.d===d);
          if(ok)return{ok:true};
          if(v.d===d+1)return{msg:`要數「小格」（空格），不是數刻度線喔！${seg}有幾小格？`};
          if(v.d!==d)return{msg:`分母不對。${seg}被平分成幾小格？那就是分母。`};
          if(m==='mix'){
            if(v.w!==w)return{msg:`箭頭在哪兩個整數之間？整數部分是比較小的那個。`};
            if(v.n===p)return{msg:`${p} 是假分數的分子。帶分數要從 ${w} 開始往右數喔！`};
            return{msg:`從整數 ${w} 開始，往右數到箭頭有幾小格？`};
          }
          if(k>0&&v.n===t0)return{msg:`這條數線是從 <b>${k}</b> 開始的！${k} = ${frac(k*d,d)}，還要再加上 ${k*d} 小格喔。`};
          if(k===0&&v.n===p+1)return{msg:`從 0 開始數「小格」，不要把 0 那條刻度線也算進去。`};
          if(v.n===r)return{msg:`這是從 ${w} 數過去的格數。寫假分數要從 <b>0</b> 開始算喔！${w} = ${frac(w*d,d)}，再加上 ${r}。`};
          return{msg:k?`先想：${k} 是幾分之幾？再加上從 ${k} 數到箭頭的小格數。可以按「顯示分數刻度」幫忙。`:`再數一次：從 0 到箭頭一共幾小格？可以點小格幫忙數。`};
        },
        hint:m==='mix'
          ?`① ${seg}有幾小格？→ 分母<br>② 箭頭在哪兩個整數之間？→ 比較小的是整數<br>③ 從那個整數往右數幾小格？→ 分子`
          :(k?`① ${seg}有幾小格？→ 分母<br>② 這條數線從 ${k} 開始，${k} = ${frac(k*d,d)}<br>③ 從 ${k} 往右數到箭頭幾小格，再加上 ${k*d} → 分子`
             :`① 0 到 1 之間有幾小格？→ 分母<br>② 從 0 數到箭頭一共幾小格？→ 分子<br>也可以按「顯示分數刻度」幫忙。`),
        solution:m==='mix'
          ?`每 1 大格分成 ${d} 小格；箭頭在 ${w} 和 ${w+1} 之間，從 ${w} 再數 ${r} 小格 → ${frac(r,d,w)}`
          :(k?`${k} = ${frac(k*d,d)}，從 ${k} 往右數 ${t0} 小格：${k*d} + ${t0} = ${p} → ${frac(p,d)}`
             :`0 到 1 分成 ${d} 小格；從 0 數到箭頭共 ${p} 小格 → ${frac(p,d)}`)
      };
    }
    // 標出位置
    const d=pick([2,3,4,5,6]),k=Math.random()<.5?0:rnd(1,3),L=3;
    let p;do{p=rnd(Math.max(k*d,d)+1,(k+L)*d-1);}while(p%d===0);
    const W=Math.floor(p/d),R=p%d,asMix=Math.random()<.4;
    const target=asMix?frac(R,d,W):frac(p,d);
    const q={
      prompt:`在數線上點出 <span class="bigw">${target}</span> 的位置，再按「對答案」。`,
      sel:null,okT:null,locked:false,
      draw(fig,tools){
        tools.innerHTML='<span>👆 在數線的刻度上點一下，放上藍色標記（可以改）</span>';
        q.redraw=()=>drawLine(fig,{k,L,d,marker:q.sel,markerOk:q.okT,clickTick:q.locked?null:t=>{q.sel=t;q.redraw();}});
        q.redraw();
      },
      ans:null,
      getVals:()=>q.sel==null?null:{t:q.sel},
      emptyMsg:'先在數線的刻度上點一個位置喔！',
      check(v){
        const abs=k*d+v.t;if(abs===p)return{ok:true};
        const wv=Math.floor(abs/d),rv=abs%d,you=rv?`${frac(rv,d,wv)}（= ${frac(abs,d)}）`:whole(wv);
        return{msg:`你點的是 ${you}，要再往<b>${abs<p?'右':'左'}</b>一點。`};
      },
      reveal(){q.okT=p-k*d;q.locked=true;q.redraw();},
      hint:asMix
        ?`${target} 在 ${W} 和 ${W+1} 之間。每 1 大格分成 ${d} 小格，從 ${W} 再往右數 ${R} 小格。`
        :`先把 ${frac(p,d)} 換成帶分數：${p} ÷ ${d} = □ 餘 □。商是在哪個整數後面，餘數是再往右數幾小格。`,
      solution:asMix
        ?`${target}：從 ${W} 往右數 ${R} 小格（綠色點）。`
        :`${p} ÷ ${d} = ${W} 餘 ${R}，${frac(p,d)} = ${frac(R,d,W)}：從 ${W} 往右數 ${R} 小格（綠色點）。`
    };
    return q;
  }
});

  if(m==='int'){const d=rnd(2,9),w=rnd(2,9);
    return{key:'i'+w+'/'+d,render(show){const el=wsItem('','t3');el.appendChild(divc('wsline',`${whole(w)} = ${wb({den:d},{n:w*d},show)}`));return el;}};}
  if(m==='mix'){const d=rnd(3,12),w=rnd(1,6),r=rnd(1,d-1);
    return{key:'m'+[w,r,d],render(show){const el=wsItem('','t3');el.appendChild(divc('wsline',`${frac(r,d,w)} = ${wb({},{n:w*d+r,d},show)}`));return el;}};}
  const d=rnd(2,9),w=rnd(1,5),r=rnd(1,d-1);
  return{key:'p'+[w,r,d],render(show){const el=wsItem('','t3');el.appendChild(divc('wsline',`${frac(w*d+r,d)} = ${wb({whole:true},{w,n:r,d},show)}`));return el;}};
}
function ws4(i){
  const type=i%2?'mixed':'improper',k=i===0?0:i===1?rnd(1,3):(Math.random()<.5?0:rnd(1,3));let L,d,ps=null;
  while(!ps){L=k?3:rnd(3,5);d=pick([2,3,4,5,6]);
    const cand=[];for(let p=Math.max(k*d,d)+1;p<(k+L)*d;p++)if(p%d)cand.push(p);
    for(let g=0;g<200&&!ps;g++){const c=cand.slice().sort(()=>Math.random()-.5).slice(0,3).sort((a,b)=>a-b);
      if(c.length===3&&c[1]-c[0]>=2&&c[2]-c[1]>=2)ps=c;}}
  const lab=['ㄅ','ㄆ','ㄇ'];
  return{key:'n'+[k,L,d,ps,type],render(show){
    const el=wsItem(`在空格裡填入 ${tname(type)}。`,'t4');
    const f=divc('wsfig');drawLine(f,{k,L,d,arrows:ps.map(p=>p-k*d),arrowLabels:lab,compact:true});el.appendChild(f);
    el.appendChild(divc('wsline',ps.map((p,j)=>`<span style="margin:0 14px">${lab[j]} ${wb({whole:type==='mixed'},type==='mixed'?{w:Math.floor(p/d),n:p%d,d}:{n:p,d},show)}</span>`).join('')));
    return el;}};
}
function ws4place(){
  const d=pick([2,3,4,5,6]),k=Math.random()<.5?0:rnd(1,3);let p;do{p=rnd(Math.max(k*d,d)+1,(k+3)*d-1);}while(p%d===0);
  const asMix=Math.random()<.4,tgt=asMix?frac(p%d,d,Math.floor(p/d)):frac(p,d);
  return{key:'P'+[k,d,p],render(show){
    const el=wsItem(`在數線上畫一個箭頭，標出 ${tgt} 的位置。`,'t4');
    const f=divc('wsfig');drawLine(f,{k,L:3,d,arrows:show?[p-k*d]:[],arrowLabels:show?['答案']:null,compact:true});el.appendChild(f);
    return el;}};
}
function uniq(n,fn){const out=[],keys=new Set();let g=0;while(out.length<n&&g<400){g++;const it=fn(out.length);if(keys.has(it.key))continue;keys.add(it.key);out.push(it);}return out;}

function ws0(i){
  const d=rnd(3,8),n=(i%4===3)?d:rnd(2,d-1),color=UCOL[i%UCOL.length];
  return{key:'u'+n+'/'+d,render(show){
    const el=wsItem('','t0'),body=divc('t0body');
    body.appendChild(divc('t0lines',`<div class="wsline">${n} 個 ${frac(1,d)} 合起來是 ${wb({},{n,d},show)}</div><div class="wsline">${plusSum(n,d)} = ${wb({},{n,d},show)}</div>`));
    const f=divc('wsfig t0fig');drawBars(f,Math.floor(n/d),n%d,d,{color});body.appendChild(f);
    el.appendChild(body);return el;}};
}
let wsData=null,wsBuilt=false;
function wsGenerate(){
  const cnt=t=>+q5(`select[data-c="${t}"]`).value,on=t=>q5(`input[data-t="${t}"]`).checked&&cnt(t)>0;
  const secs=[];
  if(on(0))secs.push({t:0,items:uniq(cnt(0),ws0)});
  if(on(1))secs.push({t:1,items:uniq(cnt(1),ws1)});
  if(on(2))secs.push({t:2,items:uniq(cnt(2),ws2)});
  if(on(3)){const imp=q5('#wsImp').checked;secs.push({t:3,items:uniq(cnt(3),i=>ws3(i,imp))});}
  if(on(4)){const it=uniq(cnt(4),ws4);if(q5('#wsPlace').checked)it.push(ws4place());secs.push({t:4,items:it});}
  wsData=secs;
}
const tsize=t=>t.length>22?17:t.length>16?21:26;
function wsBuild(){
  const prev=q5('#wsPrev');prev.innerHTML='';prev.className='wsprev';
  if(!wsData||!wsData.length){prev.innerHTML='<p style="color:var(--muted)">目前每種題型都是 0 題，請至少選一種題型出題。</p>';return;}
  const title=q5('#wsTitle').value.trim()||'學習單',info=q5('#wsInfo').checked;
  const run=show=>{
    let pageNo=0,body;
    const newPage=first=>{
      pageNo++;const wrap=divc('a4wrap'),pg=divc('a4');
      pg.innerHTML=`<div class="a4body"></div><div class="a4foot">${show?'解答 ':''}第 ${pageNo} 頁</div>`;
      wrap.appendChild(pg);prev.appendChild(wrap);body=pg.querySelector('.a4body');
      if(first)body.innerHTML=show
        ?`<div class="wshead"><div class="wstitle"><span class="wstt">${title}</span><span class="keytag">解答</span></div></div>`
        :`<div class="wshead hasname"><span></span><div class="wstitle wstt" style="font-size:${tsize(title)}px">${title}</div>${info?'<div class="wsname">姓名：<u></u></div>':'<span></span>'}</div>`;
    };
    const place=el=>{
      body.appendChild(el);
      if(body.scrollHeight>body.clientHeight+1&&body.children.length>1){
        body.removeChild(el);const carry=[];
        const last=body.lastElementChild;if(last&&last.classList.contains('wssec')){body.removeChild(last);carry.push(last);}
        newPage(false);carry.forEach(c=>body.appendChild(c));body.appendChild(el);
      }
    };
    newPage(true);
    wsData.forEach((sec,si)=>{
      place(divc('wssec',`${CN[si]}、${SECT[sec.t]}`));
      const cols=(sec.t===4||sec.t===0)?1:2;
      for(let i=0;i<sec.items.length;i+=cols){
        const row=divc('wsrow c'+cols);
        for(let j=i;j<Math.min(i+cols,sec.items.length);j++){const el=sec.items[j].render(show);el.querySelector('.wsno').textContent=CIR[j]||(j+1)+'.';row.appendChild(el);}
        place(row);
      }
    });
    return pageNo;
  };
  // 自動縮放：若縮小一點能少一頁，就用比較小的版面
  let best=0,bestN=Infinity;
  for(const lv of [0,1,2]){prev.className='wsprev d'+lv;prev.innerHTML='';const n=run(false);if(n<bestN){bestN=n;best=lv;}}
  prev.className='wsprev d'+best;prev.innerHTML='';
  run(false);
  if(q5('#wsKey').checked)run(true);
  wsScale();
}
function wsScale(){
  const W=q5('#wsPrev').clientWidth||794,s=Math.min(1,(W-4)/794);
  s5.querySelectorAll('.a4wrap').forEach(w=>{w.style.width=794*s+'px';w.style.height=1123*s+'px';w.firstChild.style.transform=`scale(${s})`;});
}
async function wsRefresh(){wsGenerate();try{await document.fonts.ready;}catch(e){}wsBuild();wsBuilt=true;}
function wsEnsure(){if(!wsBuilt)wsRefresh();else wsScale();}
window.addEventListener('resize',()=>{if(s5.classList.contains('on'))wsScale();});
q5('#wsNew').onclick=wsRefresh;
const WSDEF={0:'4',1:'4',2:'4',3:'8',4:'2'};
function wsSync(){s5.querySelectorAll('.wst').forEach(r=>{const cb=r.querySelector('input'),sel=r.querySelector('select');r.classList.toggle('off',!cb.checked||sel.value==='0');});}
s5.querySelectorAll('.wst select').forEach(sel=>sel.addEventListener('change',()=>{const cb=q5(`input[data-t="${sel.dataset.c}"]`);cb.checked=sel.value!=='0';wsSync();wsRefresh();}));
s5.querySelectorAll('.wst input').forEach(cb=>cb.addEventListener('change',()=>{const sel=q5(`select[data-c="${cb.dataset.t}"]`);if(cb.checked&&sel.value==='0')sel.value=WSDEF[cb.dataset.t];wsSync();wsRefresh();}));
s5.querySelectorAll('#wsImp,#wsPlace').forEach(e=>e.addEventListener('change',wsRefresh));
s5.querySelectorAll('#wsKey,#wsInfo').forEach(e=>e.addEventListener('change',wsBuild));
q5('#wsTitle').addEventListener('input',()=>{const t=q5('#wsTitle').value.trim()||'學習單';s5.querySelectorAll('.wstt').forEach(x=>{x.textContent=t;if(x.classList.contains('wstitle'))x.style.fontSize=tsize(t)+'px';});});

function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src&&s.dataset.ok))return res();const s=document.createElement('script');s.src=src;s.onload=()=>{s.dataset.ok=1;res();};s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}
const SVGP=['fill','stroke','stroke-width','stroke-dasharray','opacity','font-size','font-weight','text-anchor','dominant-baseline','paint-order'];
function inlineSvg(root){root.querySelectorAll('svg *').forEach(el=>{const cs=getComputedStyle(el);el.setAttribute('style',SVGP.map(k=>`${k}:${cs.getPropertyValue(k)}`).join(';')+';font-family:"Noto Sans TC",sans-serif');});}
async function wsRender(msg){
  await loadScript(H2C);
  try{await document.fonts.ready;}catch(e){}
  const pages=[...s5.querySelectorAll('.a4')],out=[];
  for(let i=0;i<pages.length;i++){
    msg.textContent=`正在產生頁面…（${i+1}/${pages.length}）`;
    const pg=pages[i],old=pg.style.transform;inlineSvg(pg);pg.style.transform='none';
    let c;try{c=await window.html2canvas(pg,{scale:2,backgroundColor:'#ffffff',logging:false,width:794,height:1123});}finally{pg.style.transform=old;}
    out.push(c.toDataURL('image/jpeg',.92));
  }
  return out;
}
/* 無法直接下載時：把每一頁變成圖片，讓使用者長按（或按右鍵）儲存 */
function wsShowImages(imgs){
  let ov=document.getElementById('wsImgOv');if(ov)ov.remove();
  ov=document.createElement('div');ov.id='wsImgOv';
  ov.innerHTML=`<div class="ovbar"><div><b>這個畫面不能直接下載檔案，改用圖片儲存：</b><br>📱 手機／平板：<b>長按</b>每一頁圖片 → 選「儲存圖片」或「加入照片」，再從相簿列印。<br>💻 電腦：在圖片上按<b>右鍵</b> →「另存圖片」。</div><button class="ovx">✕ 關閉</button></div>
    <div class="ovpages">${imgs.map((u,i)=>`<figure><img src="${u}" alt="學習單第 ${i+1} 頁"><figcaption>第 ${i+1} 頁／共 ${imgs.length} 頁</figcaption></figure>`).join('')}</div>`;
  document.body.appendChild(ov);document.body.style.overflow='hidden';
  ov.querySelector('.ovx').onclick=()=>{ov.remove();document.body.style.overflow='';};
}
q5('#wsPdf').onclick=async()=>{
  const msg=q5('#wsMsg'),btn=q5('#wsPdf');
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  btn.disabled=true;msg.textContent='正在產生頁面…';
  try{
    const imgs=await wsRender(msg);
    if(dl){
      try{
        await loadScript(JSPDF);
        const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
        imgs.forEach((u,i)=>{if(i)pdf.addPage();pdf.addImage(u,'JPEG',0,0,210,297);});
        msg.textContent='請在跳出的視窗按確認，就會下載。';
        await dl.save({filename:(q5('#wsTitle').value.trim()||'學習單')+'.pdf',data:pdf.output('blob')});
        msg.textContent='✅ 下載好了！';return;
      }catch(e){
        const c=e&&e.code;
        if(c==='declined'){msg.textContent='已取消下載。';return;}
        if(c==='rate_limited'){msg.textContent='請稍等一下再按一次。';return;}
        // 其他情況（這個畫面不支援下載等）→ 改用圖片
      }
    }
    msg.textContent='已改成圖片，請長按儲存。';
    wsShowImages(imgs);
  }catch(e){
    msg.textContent='產生失敗，請再試一次。';
  }finally{btn.disabled=false;}
};

/* ================= 分頁（網址 #unit1~6） ================= */
function route(){
  const m=/^#unit([1-6])$/.exec(location.hash),u=m?+m[1]:1;
  document.querySelectorAll('.unit').forEach((s,i)=>s.classList.toggle('on',i+1===u));
  navEl.querySelectorAll('a').forEach(a=>{a.classList.toggle('on',+a.dataset.u===u);if(+a.dataset.u===u&&navEl.scrollWidth>navEl.clientWidth)navEl.scrollTo({left:a.offsetLeft-navEl.clientWidth/2+a.offsetWidth/2,behavior:'smooth'});});
  stopSpeak();
  document.querySelectorAll('#u'+u+' .card:not([hidden]) .spk').forEach(pulse);
  if(u===6)wsEnsure();
}
window.addEventListener('hashchange',route);
route();
</script>
